services:
  app-033:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-033-codegen-04:latest
    ports:
      - "8143:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
